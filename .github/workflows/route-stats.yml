name: Refresh route history (UK and Brazil)

# Monthly: last 12 months of official route punctuality from the UK CAA and
# Brazil's ANAC, used for flights the US data doesn't cover.
on:
  schedule:
    - cron: "37 6 22 * *"   # 06:37 UTC on the 22nd of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Build route history
        working-directory: backend
        run: python -u scripts/build_route_stats.py --months 12
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/route_stats.json.gz
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh UK and Brazil route history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
